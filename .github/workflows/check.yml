name: check
on:
  push:
    branches: [main]
    tags: ['**']
  pull_request:
  workflow_dispatch:
# Supersede only the same PR; main, tags and manual runs stay independent.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: true

permissions:
  contents: read
jobs:
  source-and-audio:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.12.0"
      - run: uv sync --locked
      - run: uv run --locked pytest -q
      - run: uv run --locked ruff check src tests
      - run: uv run --locked ty check src
      - run: uv build --wheel
